import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { p ->
    afterEvaluate {
        if (p.path == ':app') {
            p.tasks.register('r12RuntimeInventory') {
                doLast {
                    ['direct', 'store'].each { variant ->
                    def cfg = p.configurations.getByName(variant + 'ReleaseRuntimeClasspath')
                    def modules = cfg.incoming.resolutionResult.allComponents.findAll {
                        it.id instanceof ModuleComponentIdentifier
                    }.collect { c ->
                        [group: c.id.group, name: c.id.module, version: c.id.version]
                    }.sort { a, b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
                    new File('C:/r12-c05-packages-20260911/android-gradle-modules-' + variant + '.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(modules)) + '\n'
                    println("R12 ${variant} selected runtime modules: ${modules.size()}")
                    }
                }
            }
        }
    }
}
