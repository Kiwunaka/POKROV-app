import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { p ->
 afterEvaluate {
  if (p.path == ':app') {
   p.tasks.register('r12MavenInventory') {
    doLast {
     def cfg = p.configurations.getByName('directReleaseRuntimeClasspath')
     def artifacts = cfg.incoming.artifactView { componentFilter { it instanceof ModuleComponentIdentifier } }.artifacts
     def rows = artifacts.artifacts.collect { a -> [component:a.id.componentIdentifier.displayName, file:a.file.absolutePath, variant:a.variant.displayName] }.sort { it.component }
     def mods=cfg.incoming.resolutionResult.allComponents.findAll{it.id instanceof ModuleComponentIdentifier}.collect{[group:it.id.group,name:it.id.module,version:it.id.version]}.sort{a,b -> "${a.group}:${a.name}" <=> "${b.group}:${b.name}"}
     new File('E:/r12-c05-maven-notices/gradle-artifacts.json').text=JsonOutput.prettyPrint(JsonOutput.toJson([modules:mods,artifacts:rows]))+'\n'
     println("R12 Maven artifacts: ${rows.size()}, modules: ${mods.size()}")
    }
   }
  }
 }
}
