plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def libcoreAar = file("libs/libcore.aar")

def releaseKeystorePath = System.getenv("POKROV_ANDROID_RELEASE_KEYSTORE")
def releaseKeystorePassword = System.getenv("POKROV_ANDROID_RELEASE_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("POKROV_ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("POKROV_ANDROID_RELEASE_KEY_PASSWORD")
def hasProductionReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "space.pokrov.pokrov_android_shell"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "space.pokrov.pokrov_android_shell"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasProductionReleaseSigning) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Public Android artifacts must use operator-provided production
            // signing. Without those credentials, release outputs are left
            // unsigned and remain internal/operator-only.
            signingConfig = hasProductionReleaseSigning ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}

repositories {
    if (libcoreAar.exists()) {
        flatDir {
            dirs "libs"
        }
    }
}

dependencies {
    if (libcoreAar.exists()) {
        implementation(name: "libcore", ext: "aar")
    }

    testImplementation "junit:junit:4.13.2"
}
