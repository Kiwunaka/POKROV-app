plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def libcoreAar = file("libs/libcore.aar")

def releaseStoreFile = System.getenv("POKROV_ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("POKROV_ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("POKROV_ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("POKROV_ANDROID_RELEASE_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it }

android {
    namespace = "space.pokrov.pokrov_android_shell"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "space.pokrov.pokrov_android_shell"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Public release builds must use production-controlled signing.
            // Do not fall back to Android Debug signing for release artifacts.
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }

    if (releaseTaskRequested && !hasReleaseSigning) {
        throw new GradleException(
            "Android release signing is required. Set POKROV_ANDROID_RELEASE_STORE_FILE, " +
            "POKROV_ANDROID_RELEASE_STORE_PASSWORD, POKROV_ANDROID_RELEASE_KEY_ALIAS, and " +
            "POKROV_ANDROID_RELEASE_KEY_PASSWORD; release builds must not use signingConfigs.debug."
        )
    }
}

flutter {
    source = "../.."
}

repositories {
    if (libcoreAar.exists()) {
        flatDir {
            dirs "libs"
        }
    }
}

dependencies {
    if (libcoreAar.exists()) {
        implementation(name: "libcore", ext: "aar")
    }

    testImplementation "junit:junit:4.13.2"
}
