plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def libcoreAar = file("libs/libcore.aar")

def productionSigningInputs = [
    storeFile: System.getenv("ANDROID_SIGNING_KEY"),
    storePassword: System.getenv("ANDROID_SIGNING_STORE_PASSWORD"),
    keyPassword: System.getenv("ANDROID_SIGNING_KEY_PASSWORD"),
    keyAlias: System.getenv("ANDROID_SIGNING_KEY_ALIAS"),
]
def configuredProductionSigningInputs = productionSigningInputs.values().findAll { value ->
    value != null && !value.toString().trim().isEmpty()
}
def hasAnyProductionReleaseSigning = !configuredProductionSigningInputs.isEmpty()
def hasProductionReleaseSigning =
        configuredProductionSigningInputs.size() == productionSigningInputs.size()
def allowInternalBetaDebugSigning = providers
        .gradleProperty("pokrov.allowInternalBetaDebugSigning")
        .orElse(providers.environmentVariable("POKROV_ALLOW_INTERNAL_BETA_DEBUG_SIGNING"))
        .map { value -> value.toBoolean() }
        .orElse(false)
        .get()

android {
    namespace = "space.pokrov.pokrov_android_shell"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "space.pokrov.pokrov_android_shell"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        production {
            if (hasProductionReleaseSigning) {
                storeFile = file(productionSigningInputs.storeFile)
                storePassword = productionSigningInputs.storePassword
                keyPassword = productionSigningInputs.keyPassword
                keyAlias = productionSigningInputs.keyAlias
            }
        }
    }

    buildTypes {
        release {
            if (hasProductionReleaseSigning) {
                signingConfig = signingConfigs.production
            } else if (allowInternalBetaDebugSigning) {
                // Explicit local/operator smoke only. This output is not a
                // public, trusted, store, stable, or signing-proven candidate.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseArtifactTaskRequested = graph.allTasks.any { task ->
        def taskName = task.name
        task.project == project && (
                taskName ==~ /^assemble.*Release$/ ||
                taskName ==~ /^bundle.*Release$/ ||
                taskName ==~ /^package.*Release(?:Bundle|UniversalApk)?$/ ||
                taskName ==~ /^sign.*ReleaseBundle$/
        )
    }

    if (releaseArtifactTaskRequested && hasAnyProductionReleaseSigning && !hasProductionReleaseSigning) {
        throw new GradleException(
            "Android production signing inputs are incomplete. Configure all four canonical ANDROID_SIGNING_* inputs."
        )
    }

    if (releaseArtifactTaskRequested && hasProductionReleaseSigning &&
            !file(productionSigningInputs.storeFile).isFile()) {
        throw new GradleException(
            "Android production signing keystore is unavailable. No signing path or credential value is printed."
        )
    }

    if (releaseArtifactTaskRequested && !hasProductionReleaseSigning && !allowInternalBetaDebugSigning) {
        throw new GradleException(
            "Android release builds are fail-closed without production signing. " +
            "Use POKROV_ALLOW_INTERNAL_BETA_DEBUG_SIGNING=true only for an explicitly non-public smoke artifact."
        )
    }
}

flutter {
    source = "../.."
}

repositories {
    if (libcoreAar.exists()) {
        flatDir {
            dirs "libs"
        }
    }
}

dependencies {
    if (libcoreAar.exists()) {
        implementation(name: "libcore", ext: "aar")
    }

    testImplementation "junit:junit:4.13.2"
}
