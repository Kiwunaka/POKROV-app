name: pokrov_app_shell
description: Beta app shell widgets for the POKROV client program.
publish_to: none
version: 1.0.0-beta.4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.5
  pokrov_core_domain:
    path: ../core_domain
  pokrov_platform_contracts:
    path: ../platform_contracts
  pokrov_runtime_engine:
    path: ../runtime_engine
  pokrov_support_context:
    path: ../support_context
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1
  path_provider_platform_interface: ^2.1.2

flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GolosText-Bold.ttf
          weight: 700
        - asset: assets/fonts/GolosText-ExtraBold.ttf
          weight: 800
